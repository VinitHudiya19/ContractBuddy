<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Buddy - Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="admin-container">
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <a href="app.html" class="sidebar-logo">
                    <i class="fa-solid fa-file-contract"></i>
                    <span>Contract Buddy</span>
                </a>
            </div>
            <nav class="admin-nav">
                <a href="#" class="active">
                    <i class="fa-solid fa-users-gear"></i>
                    <span>User Management</span>
                </a>
                <a href="app.html">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back to App</span>
                </a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h2>User Management</h2>
                <div class="admin-search-bar">
                    <i class="fa-solid fa-magnifying-glass input-icon"></i>
                    <input type="text" id="user-search-input" placeholder="Search users by name or email...">
                </div>
            </header>

            <section class="stat-grid" id="stat-grid">
                <div class="stat-card">
                    <span class="stat-label">Users</span>
                    <span class="stat-value" id="stat-users">—</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Documents</span>
                    <span class="stat-value" id="stat-documents">—</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Conversations</span>
                    <span class="stat-value" id="stat-conversations">—</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Messages</span>
                    <span class="stat-value" id="stat-messages">—</span>
                </div>
            </section>

            <section class="chart-card">
                <h3>Questions asked (last 14 days)</h3>
                <div class="bar-chart" id="queries-chart"></div>
            </section>

            <div class="admin-table">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Documents</th>
                            <th>Queries</th>
                            <th>Active</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body">
                        <tr>
                            <td colspan="6" style="text-align: center;">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
