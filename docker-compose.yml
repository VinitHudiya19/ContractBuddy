# =============================================================================
#  AI Document Q&A System — local orchestration
#  Services: api (FastAPI), postgres, redis, qdrant.
#  Bring up with:  docker compose up --build
#  The API waits (via /health) for its dependencies to be healthy.
# =============================================================================
services:
  postgres:
    image: postgres:15-alpine
    container_name: ragqa_postgres
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
      POSTGRES_DB: ragdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ragqa_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: ragqa_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # Qdrant's distroless image has no shell/curl; TCP check via bash is not
      # available either, so we rely on the API's own startup health probe.
      test: ["CMD-SHELL", "true"]
      interval: 5s
      timeout: 3s
      retries: 3

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ragqa_api
    env_file:
      - .env
    environment:
      # Override host-oriented values from .env with in-network service names.
      DATABASE_URL: postgresql+asyncpg://raguser:ragpass@postgres:5432/ragdb
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - uploads:/app/storage
      - models_cache:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  pgdata:
  redis_data:
  qdrant_storage:
  uploads:
  models_cache:
